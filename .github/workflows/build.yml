name: Build

# Every push and pull request is built and tested on Windows and macOS. A pushed tag
# such as v1.0.0 additionally publishes a GitHub release with both builds.
on:
  push:
  pull_request:

env:
  QT_VERSION: '6.10.2'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          # qtimageformats brings the WebP plugin
          modules: qtimageformats
          aqtversion: '==3.3.*'
          cache: true

      - name: Configure
        run: cmake -B build -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: Kolorit-windows-x64
          path: dist

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtimageformats
          aqtversion: '==3.3.*'
          cache: true

      # Qt for macOS ships universal binaries, so one build runs on Apple Silicon and Intel
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          cmake --install build --prefix dist
          codesign --verify --deep --strict dist/Kolorit.app
          # A drag-to-install disk image: the app next to a link to /Applications.
          # hdiutil occasionally fails with "Resource busy" on CI, hence the retries.
          ln -s /Applications dist/Applications
          for attempt in 1 2 3; do
            hdiutil create -volname Kolorit -srcfolder dist -format UDZO -o Kolorit-macos-universal.dmg && break
            sleep 10
          done
          test -f Kolorit-macos-universal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Kolorit-macos-universal
          path: Kolorit-macos-universal.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Prepare the files
        run: |
          mv Kolorit-windows-x64 "Kolorit-${{ github.ref_name }}"
          zip -rq "Kolorit-${{ github.ref_name }}-windows-x64.zip" "Kolorit-${{ github.ref_name }}"
          mv Kolorit-macos-universal/Kolorit-macos-universal.dmg "Kolorit-${{ github.ref_name }}-macos-universal.dmg"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Kolorit-${{ github.ref_name }}-windows-x64.zip
            Kolorit-${{ github.ref_name }}-macos-universal.dmg
          generate_release_notes: true
          body: |
            **Windows x64.** No installation needed: unzip the archive and run `bin\Kolorit.exe`.
            The command-line tool `bin\kolorit-cli.exe` is in the same folder.

            **macOS 13 or newer, Apple Silicon and Intel.** Open the disk image and drag Kolorit
            to Applications. The app is not notarized, so macOS blocks the first launch: open
            System Settings → Privacy & Security and click *Open Anyway*, or run
            `xattr -dr com.apple.quarantine /Applications/Kolorit.app`.
            The command-line tool is `/Applications/Kolorit.app/Contents/MacOS/kolorit-cli`.
